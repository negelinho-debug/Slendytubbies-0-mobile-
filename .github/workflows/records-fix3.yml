
name: Records Fix 3 - Safe Script Match

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Branch from successful Fix 2'
        required: true
        default: 'records-code-fix2-1-1'
        type: string

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Require private repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = true || {
            echo 'Make repository private first.' >&2
            exit 1
          }

      - name: Checkout recovered project
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_branch }}
          fetch-depth: 0
          lfs: true
          persist-credentials: true

      - name: Verify Unity project
        shell: bash
        run: |
          set -euo pipefail
          test -d Assets
          test -f ProjectSettings/ProjectVersion.txt
          mkdir -p reports

          if [ ! -f Assets/Scripts/RecordsRuntimeLog.cs ]; then
            echo 'Note: iPhone runtime logger not found.'
          fi

      - name: Download original Records game
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original" "$RUNNER_TEMP/download"

          gh release download 0.0.1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'Slendytubbies.0.Records.zip' \
            --dir "$RUNNER_TEMP/download"

          unzip -q \
            "$RUNNER_TEMP/download/Slendytubbies.0.Records.zip" \
            -d "$RUNNER_TEMP/original"

          dll="$(find "$RUNNER_TEMP/original" \
            -type f -name 'Assembly-CSharp.dll' -print -quit)"

          test -n "$dll" || {
            echo 'Original Mono DLL not found.'
            exit 1
          }

          echo "MANAGED_DIR=$(dirname "$dll")" >> "$GITHUB_ENV"

      - name: Install ILSpy
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Decompile original assemblies
        shell: bash
        run: |
          set -euo pipefail

          dotnet tool install ilspycmd \
            --tool-path "$RUNNER_TEMP/tools" \
            --version 9.1.0.7988

          mkdir -p "$RUNNER_TEMP/code"
          success=0

          while IFS= read -r -d '' dll; do
            name="$(basename "$dll" .dll)"

            case "$name" in
              Unity*|System*|Microsoft*|Mono*|mscorlib|netstandard|Newtonsoft*)
                continue ;;
            esac

            mkdir -p "$RUNNER_TEMP/code/$name"

            if "$RUNNER_TEMP/tools/ilspycmd" \
              -p --nested-directories \
              -o "$RUNNER_TEMP/code/$name" \
              -r "$MANAGED_DIR" "$dll" \
              > "$RUNNER_TEMP/ilspy-$name.log" 2>&1; then
              success=$((success + 1))
            else
              echo "Decompile failed: $name"
            fi

          done < <(find "$MANAGED_DIR" \
            -maxdepth 1 -name '*.dll' -type f -print0)

          test "$success" -gt 0 || {
            echo 'No assemblies decompiled.'
            exit 1
          }

          echo "Assemblies decompiled: $success"

      - name: Restore scripts using class and namespace
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from collections import defaultdict, Counter
          import csv
          import os
          import re

          assets = Path('Assets')
          code = Path(os.environ['RUNNER_TEMP']) / 'code'

          marker = 'Dummy class. This could have happened'
          by_name = defaultdict(list)

          for file in code.rglob('*.cs'):
              if file.name.lower() != 'assemblyinfo.cs':
                  by_name[file.name.casefold()].append(file)

          def namespace(text):
              match = re.search(
                  r'\bnamespace\s+([\w.]+)\s*(?:\{|;)',
                  text
              )
              return match.group(1) if match else ''

          def declares(text, name):
              return bool(re.search(
                  r'\b(?:class|struct|interface|enum)\s+' +
                  re.escape(name) + r'\b',
                  text
              ))

          rows = []

          for target in assets.rglob('*.cs'):
              old = target.read_text(
                  encoding='utf-8-sig',
                  errors='replace'
              )

              if marker not in old:
                  continue

              candidates = []

              for source in by_name.get(
                  target.name.casefold(), []
              ):
                  content = source.read_text(
                      encoding='utf-8-sig',
                      errors='replace'
                  )

                  if marker not in content and declares(
                      content, target.stem
                  ):
                      candidates.append((source, content))

              original_ns = namespace(old)

              if original_ns:
                  candidates = [
                      (file, content)
                      for file, content in candidates
                      if namespace(content) == original_ns
                  ]

              status = 'UNRESOLVED'
              reason = f'{len(candidates)} compatible candidates'

              if len(candidates) == 1:
                  source, replacement = candidates[0]

                  if len(replacement.strip()) > 100:
                      target.write_text(
                          replacement,
                          encoding='utf-8'
                      )
                      status = 'RESTORED'
                      reason = str(source.relative_to(code))

              # Keep original .cs.meta GUID unchanged.
              rows.append((str(target), status, reason))

          with open(
              'reports/fix3-scripts.csv',
              'w',
              newline='',
              encoding='utf-8'
          ) as handle:
              writer = csv.writer(handle)
              writer.writerow([
                  'script',
                  'status',
                  'source_or_reason'
              ])
              writer.writerows(rows)

          def count(pattern):
              return sum(1 for _ in assets.rglob(pattern))

          terminal = [
              str(file)
              for file in assets.rglob('*.cs')
              if re.search(
                  r'terminal|password|record|login|command',
                  file.name,
                  re.I
              )
          ]

          Path(
              'reports/fix3-terminal-files.txt'
          ).write_text(
              '\n'.join(terminal) + '\n',
              encoding='utf-8'
          )

          counts = Counter(row[1] for row in rows)

          report = [
              'Slendytubbies 0: Records / Fix 3',
              f'Newly restored: {counts["RESTORED"]}',
              f'Still unresolved: {counts["UNRESOLVED"]}',
              f'Scenes: {count("*.unity")}',
              f'Animations: {count("*.anim")}',
              f'Animator controllers: {count("*.controller")}',
              f'Terminal-named scripts: {len(terminal)}',
              'Original script GUIDs preserved.',
              'Terminal passwords were not modified.',
              'Gameplay has NOT been tested.',
              'This is NOT an IPA build.'
          ]

          Path(
              'reports/fix3-summary.txt'
          ).write_text(
              '\n'.join(report) + '\n',
              encoding='utf-8'
          )

          print('\n'.join(report))
          PY

      - name: Create new recovery branch
        shell: bash
        run: |
          set -euo pipefail

          branch="records-code-fix3-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          git switch -c "$branch"

          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'

          git add Assets reports/fix3-*.txt \
            reports/fix3-scripts.csv

          git commit -m \
            'Records Fix 3 - recover more original game code'

          git push -u origin "$branch"

          echo "### New branch: $branch" \
            >> "$GITHUB_STEP_SUMMARY"

          cat reports/fix3-summary.txt \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Records-Fix3-Reports
          path: reports/fix3-*
          retention-days: 14
          if-no-files-found: warn
