
name: Slendytubbies Records Recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Slendytubbies 0 Records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p game

          gh release download 0.0.1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.zip" \
            --dir game

          ls -lh game/

      - name: Extract original game
        shell: bash
        run: |
          mkdir -p unpack

          for zipfile in game/*.zip; do
            unzip -q "$zipfile" -d unpack
          done

          DATA_DIR=$(find unpack \
            -type f -name globalgamemanagers \
            -printf '%h\n' | head -1)

          if [ -z "$DATA_DIR" ]; then
            echo "Unity game data not found"
            exit 1
          fi

          GAME_DIR=$(dirname "$DATA_DIR")
          echo "GAME_DIR=$GAME_DIR" >> "$GITHUB_ENV"

          echo "Found game: $GAME_DIR"
          ls -la "$GAME_DIR"

      - name: Install .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Download AssetRipper CLI
        run: |
          git clone --depth 1 \
            https://github.com/nowl-it/AssetRipperCLI.git \
            ripper-src

      - name: Build AssetRipper
        run: |
          dotnet publish \
            ripper-src/Source/AssetRipper.GUI.Free/AssetRipper.GUI.Free.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishAot=false \
            -o "$GITHUB_WORKSPACE/ripper-bin"

      - name: Recover Unity project
        id: recovery
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p recovered

          dotnet \
            "$GITHUB_WORKSPACE/ripper-bin/AssetRipper.GUI.Free.dll" \
            --cli \
            --input "$GITHUB_WORKSPACE/$GAME_DIR" \
            --output "$GITHUB_WORKSPACE/recovered" \
            --mode Unity \
            2>&1 | tee recovery.log

          exit ${PIPESTATUS[0]}

      - name: Inspect recovered files
        if: always()
        run: |
          echo "Recovered files:"
          find recovered -maxdepth 3 \
            -type f | head -100 || true

      - name: Upload recovered project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Records-Recovery
          path: |
            recovered/
            recovery.log
          retention-days: 7
          if-no-files-found: warn

      - name: Report recovery failure
        if: steps.recovery.outcome == 'failure'
        run: |
          echo "AssetRipper recovery failed."
          exit 1
