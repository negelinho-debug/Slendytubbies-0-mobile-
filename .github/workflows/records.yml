
name: Slendytubbies Records Recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download original game
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p game

          gh release download 0.0.1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.zip" \
            --dir game

          ls -lh game/

      - name: Extract game
        shell: bash
        run: |
          mkdir -p unpack

          for file in game/*.zip; do
            unzip -q "$file" -d unpack
          done

          DATA_DIR=$(find unpack \
            -type f -name globalgamemanagers \
            -printf '%h\n' | head -1)

          if [ -z "$DATA_DIR" ]; then
            echo "Unity data not found!"
            exit 1
          fi

          GAME_DIR=$(dirname "$DATA_DIR")
          echo "GAME_DIR=$GAME_DIR" >> "$GITHUB_ENV"

          echo "Game found: $GAME_DIR"

      - name: Install .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Download AssetRipper
        run: |
          git clone --depth 1 \
            https://github.com/nowl-it/AssetRipperCLI.git \
            ripper-src

      - name: Build AssetRipper
        run: |
          dotnet publish \
            ripper-src/Source/AssetRipper.GUI.Free/AssetRipper.GUI.Free.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishAot=false \
            -o "$GITHUB_WORKSPACE/ripper-bin"

      - name: Recover Unity project
        id: recovery
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p recovered

          dotnet \
            "$GITHUB_WORKSPACE/ripper-bin/AssetRipper.GUI.Free.dll" \
            --cli \
            --input "$GITHUB_WORKSPACE/$GAME_DIR" \
            --output "$GITHUB_WORKSPACE/recovered" \
            --mode Unity \
            2>&1 | tee recovery.log

          exit ${PIPESTATUS[0]}

      - name: Check recovered project
        if: always()
        shell: bash
        run: |
          echo "Recovered files:"
          find recovered -type f | wc -l
          find recovered -maxdepth 3 -type f \
            | head -50 || true

      - name: Pack recovered project
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts

          if [ -n "$(find recovered -type f -print -quit)" ]; then
            zip -q -r \
              artifacts/Records-Recovered-Project.zip \
              recovered/
          else
            echo "No recovered project files."
          fi

          if [ -f recovery.log ]; then
            cp recovery.log artifacts/recovery.log
          fi

          ls -lh artifacts/

      - name: Upload recovered ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Records-Recovery
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn

      - name: Report recovery failure
        if: steps.recovery.outcome == 'failure'
        run: exit 1
